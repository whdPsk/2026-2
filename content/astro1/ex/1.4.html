<div class="exq"><b>상황.</b> 질량 흡수계수가 일정한 구대칭 가스에서 중력과 복사력을 비교한다. [[F03.09]]</div><div class="derive"><div class="dtitle"><span class="tag">풀이</span>에딩턴 한계: HW1 복습 변형</div><ol><li>광자 운동량 p=E/c — 흡수되면 그 운동량이 물질로 전달된다. 단위 질량당 복사 가속도 \(g_{\rm rad}=\kappa_m L/(4\pi r^2c)\).</li><li>\(GM/r^2=g_{\rm rad}\)로 둔다. 거리 의존성이 소거된다.</li></ol></div><div class="formula"><div class="ftitle">결과</div><p>\(L_{\rm Edd}=4\pi GMc/\kappa_m\). 이 값 이상이면 이 단순 정적 모형에서 복사 가속도가 중력을 넘는다.</p></div>
