<div class="stmt"><p>감속 전하의 전기력선 천이층을 그리고 Eθ/Er를 얻은 뒤, 전기 선속 보존과 r≈cT를 연결한다. 단원09 예제는 풀이 구조의 대조용이다.</p><p class="note">상태: 배부 문제지 원문 확인 · 관련 단원: U11</p><p><b>풀이 방향(힌트)</b></p><ol><li>먼저 세 길이 vT sinθ, cΔt, r를 그림에 표시한다.</li><li>Δt=v/a를 대입해 a가 어디서 나오는지 보인다.</li><li>전기 선속 보존으로 방사성분을 정하고 횡성분과의 비율을 적용한다.</li><li>마지막 문장은 수식이 아니라 에너지 수송의 거리 독립성을 설명한다.</li></ol></div><!--/stmt-->
