<div class="exq"><b>상황.</b> 등방 복사 에너지밀도 u=3×10⁻¹² erg cm⁻³. 복사압과 순플럭스는? [[F03.08]]</div><div class="derive"><div class="dtitle"><span class="tag">풀이</span>복사 에너지밀도에서 압력</div><ol><li>등방: \(u=4\pi I/c\), \(P=\frac1c\int I\cos^2\theta d\Omega=4\pi I/3c\) → P=u/3. [[F03.10]]</li><li>erg cm⁻³ = dyn cm⁻²임을 확인한다.</li><li>\(\int\cos\theta\,d\Omega=0\) → 순 F=0.</li></ol></div><div class="formula"><div class="ftitle">결과</div><p>P=10⁻¹² dyn cm⁻², 순플럭스 F=0.</p></div>
