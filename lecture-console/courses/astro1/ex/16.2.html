<div class="exq"><b>상황.</b> L=AρT^α−H, A,H>0 상수인 평형을 등압으로 섭동한다.</div><div class="derive"><div class="dtitle"><span class="tag">풀이</span>냉각곡선 기울기</div><ol><li>등압에서 ρ∝1/T이므로 냉각항∝T^(α−1).</li><li>평형에서 (∂L/∂T)P=(α−1)H/T.</li></ol></div><div class="formula"><div class="ftitle">결과</div><p>α<1이면 이 모형은 등압 불안정. 가열 법칙을 바꾸면 임계 기울기도 달라진다.</p></div>
